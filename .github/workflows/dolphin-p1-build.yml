name: Build Dolphin-P1 OpenWrt 24.10.5

on:
  push:
    branches:
      - dolphin-p1-openwrt-24.10.5
    paths:
      - 'dolphin-p1/**'
      - '.github/workflows/dolphin-p1-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dolphin-p1-openwrt-build
  cancel-in-progress: true

jobs:
  build:
    name: Build SD-card firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          sudo apt-get clean
          df -h /

      - name: Check out build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-dev python3-setuptools \
            rsync swig time unzip zlib1g-dev file wget bc libelf-dev libzstd-dev \
            zstd cpio libgmp-dev libmpc-dev libmpfr-dev
          sudo apt-get clean
          df -h /

      - name: Fetch OpenWrt 24.10.5 sources
        run: |
          git clone --depth 1 --branch v24.10.5 \
            https://github.com/openwrt/openwrt.git openwrt
          git -C openwrt describe --tags --exact-match

      - name: Apply Dolphin-P1 board integration
        run: |
          bash dolphin-p1/apply.sh "$GITHUB_WORKSPACE/openwrt"
          cp dolphin-p1/config/dolphin-p1.seed openwrt/.config

      - name: Update and install OpenWrt feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        working-directory: openwrt
        run: |
          make defconfig
          grep -E 'CONFIG_TARGET_sunxi|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_DWMAC_SUN8I|CONFIG_PACKAGE_luci' .config
          df -h /

      - name: Download sources
        working-directory: openwrt
        run: make download -j2

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j2 V=s
          echo "Built SD images:"
          find bin/targets/sunxi/cortexa7 -maxdepth 1 -type f -iname '*sdcard.img.gz' -print

      - name: Validate and stage image
        working-directory: openwrt
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          IMAGE="$(find bin/targets/sunxi/cortexa7 -maxdepth 1 -type f -iname '*dolphin-p1*sdcard.img.gz' | sort | head -n1)"
          COUNT="$(find bin/targets/sunxi/cortexa7 -maxdepth 1 -type f -iname '*dolphin-p1*sdcard.img.gz' | wc -l)"
          if [ "$COUNT" -ne 1 ] || [ -z "$IMAGE" ]; then
            echo "Expected exactly one Dolphin-P1 SD image; found $COUNT."
            find bin/targets/sunxi/cortexa7 -maxdepth 1 -type f -print | sort
            exit 1
          fi
          gzip -t "$IMAGE"
          cp "$IMAGE" "$GITHUB_WORKSPACE/out/"
          cd "$GITHUB_WORKSPACE/out"
          sha256sum ./*.img.gz | tee SHA256SUMS.txt
          ls -lh

      - name: Upload SD-card image
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-P1-OpenWrt-24.10.5-SD
          path: out/*
          if-no-files-found: error
          retention-days: 14
